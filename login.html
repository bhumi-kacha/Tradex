<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TradeX | Login</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- NAVIGATION -->

    <header>

        <nav class="navbar">

            <div class="logo">
                Trade<span>X</span>
            </div>

            <ul class="nav-links">

    <li><a href="index.html">Home</a></li>

    <li><a href="market.html">Market</a></li>

    <li><a href="trade.html">Trade</a></li>

    <li><a href="portfolio.html">Portfolio</a></li>

    <li><a href="learn.html">Learn</a></li>

</ul>
        </nav>

    </header>



    <!-- LOGIN -->

    <main class="login-page">

        <div class="login-box">

            <p class="small-title">
                WELCOME TO TRADEX
            </p>

            <h1>
                Login
            </h1>

            <p class="login-description">
                Login to access your paper trading account.
            </p>


            <label>
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
            >


            <label>
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
            >


            <button
                class="login-submit"
                onclick="loginUser()"
            >
                Login
            </button>


            <p class="register-text">
                Don't have an account?
                <a href="#" onclick="registerUser()">
                    Create Account
                </a>
            </p>

        </div>

    </main>



    <!-- FOOTER -->

    <footer>

        <h3>
            TradeX
        </h3>

        <p>
            Paper Trading Platform for Educational Purposes
        </p>

        <p>
            © 2026 TradeX College Project
        </p>

    </footer>



    <script src="js/app.js"></script>

</body>

</html>
